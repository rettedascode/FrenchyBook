symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Link in der E-Mail ist 1 Stunde gültig
    lifetime: 3600
    # Pro Person höchstens eine neue Reset-Mail alle 10 Minuten (schützt vor Mail-Spam)
    throttle_limit: 600
    # Abgelaufene Anfragen automatisch aufräumen
    enable_garbage_collection: true
