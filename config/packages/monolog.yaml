monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            # wie in prod: Fehlerprotokoll für /admin/fehler
            admin_errors:
                type: rotating_file
                path: '%kernel.logs_dir%/errors.log'
                level: error
                max_files: 30
                formatter: monolog.formatter.json
                channels: ["!deprecation", "!request"]
            admin_request_errors:
                type: rotating_file
                path: '%kernel.logs_dir%/errors.log'
                level: critical
                max_files: 30
                formatter: monolog.formatter.json
                channels: ["request"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # Fehlerprotokoll für die Verwaltung (/admin/fehler): App-Fehler ab „error“ …
            admin_errors:
                type: rotating_file
                path: '%kernel.logs_dir%/errors.log'
                level: error
                max_files: 30
                formatter: monolog.formatter.json
                channels: ["!deprecation", "!request"]
            # … und bei Anfragen nur echte Serverfehler (500), keine 404 von Bots
            admin_request_errors:
                type: rotating_file
                path: '%kernel.logs_dir%/errors.log'
                level: critical
                max_files: 30
                formatter: monolog.formatter.json
                channels: ["request"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
