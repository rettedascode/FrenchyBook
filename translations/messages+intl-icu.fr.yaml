help:
  title: 'Comment fonctionne FrenchyBook'
  intro: 'Pas de panique, c’est très simple. Touche un thème et tu verras, étape par étape, ce qu’il faut faire.'
  toc: 'Thèmes'
  link: 'Guide'
  card_text: 'Tout expliqué pas à pas : ajouter, emprunter et prêter des livres.'
  new_here: 'Nouveau ici ?'
  how_it_works: 'Voici comment ça marche'
  how_does_it_work: 'Comment ça marche ?'
  share: 'Partager'
  back_to_top: 'Haut de page'
  still_stuck: 'Encore un doute ?'
  still_stuck_text: 'Demande simplement à quelqu’un du groupe : on te montrera volontiers.'
  app:
    title: 'Mettre FrenchyBook sur ton téléphone'
    summary: 'Avec sa propre icône sur l’écran d’accueil, comme une vraie appli.'
    android_title: 'Android (par ex. Samsung, Google Pixel)'
    android_1: 'Ouvre frenchybook.com dans Chrome et connecte-toi.'
    android_2: 'Touche « Installer l’appli ». Le bouton se trouve sur l’aperçu ou dans le profil. Sinon : touche les trois points ⋮ en haut à droite, puis « Installer l’appli ».'
    android_3: 'Confirme avec « Installer ». C’est fait : FrenchyBook est maintenant sur ton écran d’accueil.'
    android_hint: 'Désormais, ouvre simplement FrenchyBook avec son icône, comme n’importe quelle appli.'
    ios_title: 'iPhone et iPad'
    ios_1: 'Ouvre frenchybook.com dans Safari (le navigateur avec la boussole). Ça ne marche pas avec les autres navigateurs.'
    ios_2: 'Touche « Partager » en bas au milieu : le carré avec la flèche vers le haut.'
    ios_3: 'Fais défiler la liste un peu vers le haut et touche « Sur l’écran d’accueil ».'
    ios_4: 'Touche « Ajouter » en haut à droite. C’est fait !'
    ios_home: 'Sur l’écran d’accueil'
  add:
    title: 'Ajouter un livre'
    summary: 'Le plus rapide : avec l’appareil photo du téléphone et le code-barres.'
    scan_title: 'Avec le code-barres (le plus simple)'
    scan_1: 'Touche « Ajouter » dans la barre en bas. Sur ordinateur, c’est en haut.'
    scan_2: 'Touche « Scanner le code-barres ». Si ton téléphone demande si FrenchyBook peut utiliser l’appareil photo, touche « Autoriser ».'
    scan_3: 'Vise le code-barres au dos du livre. FrenchyBook le reconnaît tout seul et remplit pour toi le titre, l’auteur et la couverture.'
    scan_4: 'Vérifie rapidement que tout est juste, puis touche « Enregistrer le livre ».'
    scan_hint: 'Pas de code-barres, ou l’appareil photo ne veut pas ? Tape simplement le numéro au-dessus du code-barres (il commence souvent par 978).'
    manual_title: 'Sans code-barres (par ex. vieux livres)'
    manual_1: 'Touche « Ajouter sans ISBN ».'
    manual_2: 'Avec « Prendre une photo », photographie la couverture. C’est facultatif, mais les autres reconnaîtront le livre tout de suite.'
    manual_3: 'Indique le titre et l’auteur, puis touche « Enregistrer le livre ».'
  find:
    title: 'Trouver des livres'
    summary: 'Regarde quels livres ont tes amis.'
    step_1: 'Touche « Livres ». Tu y vois les livres de tout le groupe.'
    step_2: 'Dans le champ de recherche en haut, tu peux chercher par titre, auteur ou ISBN.'
    step_3: 'Les boutons en dessous filtrent la liste : « Disponibles » montre seulement les livres libres en ce moment, « Mes livres » seulement les tiens.'
    legend_title: 'Que veulent dire les étiquettes de couleur ?'
    legend_available: 'Le livre est chez son propriétaire. Tu peux le demander et aller le chercher.'
    legend_lent: 'Quelqu’un le lit en ce moment. Tu peux t’inscrire sur la liste d’attente.'
    legend_overdue: 'La date de retour approche ou est déjà passée.'
    legend_reserved: 'La demande a été acceptée – le livre attend d’être récupéré.'
  borrow:
    title: 'Emprunter un livre'
    summary: 'Demande à tes amis si tu peux avoir un livre.'
    step_1: 'Choisis un livre avec l’étiquette verte « À récupérer chez le propriétaire » et touche-le. Sous « Emplacement et statut », tu vois dans quel quartier il se trouve.'
    step_2: 'Touche « Demander à l’emprunter ». Si tu veux, ajoute un petit message.'
    step_3: 'La personne à qui appartient le livre est prévenue et te répond. Tu vois la réponse sur ton « Aperçu » et tu reçois aussi un e-mail.'
    step_4: 'Ta demande est acceptée ? Convenez d’un moment pour récupérer le livre. Il apparaît maintenant chez toi sous « Empruntés ». Quand tu as fini, rends-le tout simplement.'
  requests:
    title: 'Quelqu’un veut ton livre'
    summary: 'Voici comment répondre à une demande.'
    step_1: 'Ouvre l’« Aperçu ». Les nouvelles demandes sont tout en haut, sous « Demandes pour toi ». Le chiffre dans le point rouge indique combien il y en a.'
    step_2: 'Touche « Accepter » si tu veux prêter le livre. Il est alors considéré comme prêté pour 4 semaines. Donne-le simplement en main propre.'
    step_3: 'Ça ne tombe pas bien ? Touche « Refuser ». L’autre personne reçoit un petit message sympa.'
  lend:
    title: 'Prêter un livre directement'
    summary: 'Tu as donné un livre à quelqu’un ? Voici comment l’indiquer.'
    step_1: 'Ouvre ton livre et touche « Prêter ».'
    step_2: 'Choisis qui reçoit le livre. Si tu veux, indique aussi pour quand il doit être rendu, par exemple « 2 semaines ».'
    step_3: 'Tu as récupéré le livre ? Ouvre-le et touche « Marquer comme rendu ». Ou, sur l’aperçu, sous « Prêtés », touche « Rendu ».'
    hint: 'Une fois la date de retour passée, FrenchyBook envoie un rappel sympa par e-mail. Pas besoin de courir après qui que ce soit.'
  notifications:
    title: 'Activer les notifications'
    summary: 'Pour que ton téléphone te prévienne quand quelqu’un veut un de tes livres.'
    step_1: 'Touche « Profil » en bas.'
    step_2: 'Sous « Notifications », touche « Activer ». Si ton téléphone demande, touche « Autoriser ».'
    step_3: 'C’est fait ! Avec « Envoyer un test », tu peux vérifier que ça marche.'
    ios_hint: 'Sur iPhone, ça ne marche qu’une fois FrenchyBook installé sur l’écran d’accueil (voir « Mettre FrenchyBook sur ton téléphone »). Ouvre ensuite FrenchyBook avec son icône et active les notifications à cet endroit.'
  account:
    title: 'Connexion, mot de passe et langue'
    summary: 'Tout sur ton compte.'
    login: 'Tu te connectes avec ton nom d’utilisateur et ton mot de passe, pas avec ton adresse e-mail. Laisse « Rester connecté » coché : tu n’auras que rarement à le refaire.'
    forgot: 'Mot de passe oublié ? Touche « Mot de passe oublié ? » sur la page de connexion. Tu recevras un e-mail avec un lien pour choisir un nouveau mot de passe.'
    language: 'En haut à droite, avec le drapeau, tu peux passer du français à l’allemand.'
    profile: 'Dans le « Profil », tu peux changer ton nom, ton adresse e-mail et ton mot de passe.'
  problems:
    title: 'Si quelque chose ne marche pas'
    summary: 'Les questions les plus fréquentes et ce qui aide.'
    camera_q: 'L’appareil photo ne s’allume pas.'
    camera_a: 'La première fois, ton téléphone demande si FrenchyBook peut utiliser l’appareil photo : il faut toucher « Autoriser ». Si tu as touché « Bloquer » par erreur, autorise l’appareil photo pour frenchybook.com dans les réglages de ton navigateur. Ou tape simplement le numéro du code-barres.'
    scan_q: 'Le code-barres n’est pas reconnu.'
    scan_a: 'Mets-toi à la lumière et tiens le téléphone immobile, à environ une main du livre. Le code-barres doit être entièrement dans le cadre. Si ça ne marche toujours pas, tape le numéro au-dessus du code-barres.'
    mail_q: 'Je ne reçois pas d’e-mail.'
    mail_a: 'Attends quelques minutes et regarde aussi dans tes spams. Les e-mails viennent de noreply@frenchybook.com.'
    login_q: 'Je n’arrive pas à me connecter.'
    login_a: 'Utilise ton nom d’utilisateur, pas ton adresse e-mail. Attention aux majuscules et minuscules dans le mot de passe. Si ça ne suffit pas, touche « Mot de passe oublié ? ».'
    edit_q: 'Je me suis trompé en tapant.'
    edit_a: 'Ouvre le livre et touche « Modifier ». Tu peux tout y changer, et aussi supprimer le livre.'
    lost_q: 'Un livre n’est pas revenu.'
    lost_a: 'Sur l’aperçu, sous « Prêtés », tu vois qui a quel livre et depuis quand. Une fois la date de retour passée, le livre est marqué en rouge et FrenchyBook envoie automatiquement un rappel par e-mail.'

