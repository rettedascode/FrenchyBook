help:
  title: 'So funktioniert FrenchyBook'
  intro: 'Keine Sorge, es ist ganz einfach. Tippe auf ein Thema, dann siehst du Schritt für Schritt, was zu tun ist.'
  toc: 'Themen'
  link: 'Anleitung'
  card_text: 'Schritt für Schritt erklärt: Bücher eintragen, ausleihen und verleihen.'
  new_here: 'Neu hier?'
  how_it_works: 'So funktioniert’s'
  how_does_it_work: 'Wie funktioniert das?'
  share: 'Teilen'
  back_to_top: 'Nach oben'
  still_stuck: 'Immer noch unsicher?'
  still_stuck_text: 'Frag einfach jemanden aus der Gruppe – wir zeigen es dir gern persönlich.'
  app:
    title: 'FrenchyBook aufs Handy holen'
    summary: 'Mit eigenem Symbol auf dem Startbildschirm – wie eine richtige App.'
    android_title: 'Android (z. B. Samsung, Google Pixel)'
    android_1: 'Öffne frenchybook.com in Chrome und melde dich an.'
    android_2: 'Tippe auf „App installieren“. Du findest den Button auf der Übersicht oder im Profil. Falls nicht: Tippe oben rechts auf die drei Punkte ⋮ und dann auf „App installieren“.'
    android_3: 'Bestätige mit „Installieren“. Fertig – FrenchyBook liegt jetzt auf deinem Startbildschirm.'
    android_hint: 'Ab jetzt öffnest du FrenchyBook einfach über das Symbol, wie jede andere App.'
    ios_title: 'iPhone und iPad'
    ios_1: 'Öffne frenchybook.com in Safari (dem Browser mit dem Kompass-Symbol). In anderen Browsern klappt es nicht.'
    ios_2: 'Tippe unten in der Mitte auf „Teilen“: das Quadrat mit dem Pfeil nach oben.'
    ios_3: 'Schiebe die Liste etwas nach oben und tippe auf „Zum Home-Bildschirm“.'
    ios_4: 'Tippe oben rechts auf „Hinzufügen“. Fertig!'
    ios_home: 'Zum Home-Bildschirm'
  add:
    title: 'Ein Buch eintragen'
    summary: 'Am schnellsten mit der Handykamera über den Strichcode.'
    scan_title: 'Mit dem Strichcode (am einfachsten)'
    scan_1: 'Tippe unten in der Leiste auf „Hinzufügen“. Am Computer findest du es oben.'
    scan_2: 'Tippe auf „Barcode scannen“. Wenn dein Handy fragt, ob FrenchyBook die Kamera benutzen darf, tippe auf „Erlauben“.'
    scan_3: 'Halte die Kamera auf den Strichcode auf der Rückseite des Buchs. FrenchyBook erkennt ihn von allein und füllt Titel, Autor und Bild für dich aus.'
    scan_4: 'Schau kurz drüber, ob alles stimmt, und tippe auf „Buch speichern“.'
    scan_hint: 'Kein Strichcode oder die Kamera will nicht? Tippe einfach die Nummer über dem Strichcode ein (sie beginnt meist mit 978).'
    manual_title: 'Ohne Strichcode (z. B. alte Bücher)'
    manual_1: 'Tippe auf „Ohne ISBN eintragen“.'
    manual_2: 'Mach mit „Foto aufnehmen“ ein Foto vom Buchcover. Das ist freiwillig, aber so erkennen die anderen das Buch sofort.'
    manual_3: 'Trag Titel und Autor ein und tippe auf „Buch speichern“.'
  find:
    title: 'Bücher finden'
    summary: 'Sieh nach, welche Bücher deine Freunde haben.'
    step_1: 'Tippe auf „Bücher“. Hier siehst du die Bücher von allen in der Gruppe.'
    step_2: 'Oben im Suchfeld kannst du nach Titel, Autor oder ISBN suchen.'
    step_3: 'Mit den Knöpfen darunter grenzt du die Liste ein: „Verfügbar“ zeigt nur Bücher, die gerade frei sind, „Meine Bücher“ nur deine eigenen.'
    legend_title: 'Was bedeuten die farbigen Schilder?'
    legend_available: 'Das Buch ist beim Eigentümer. Du kannst es anfragen und dort abholen.'
    legend_lent: 'Jemand liest das Buch gerade. Du kannst dich auf die Warteliste setzen.'
    legend_overdue: 'Der Rückgabetermin steht kurz bevor oder ist schon vorbei.'
  borrow:
    title: 'Ein Buch ausleihen'
    summary: 'Frag bei deinen Freunden an, ob du ein Buch haben darfst.'
    step_1: 'Such dir ein Buch mit dem grünen Schild „Abholung bei Eigentümer“ aus und tippe es an. Unter „Standort & Status“ siehst du, in welchem Bezirk es ist.'
    step_2: 'Tippe auf „Ausleihen anfragen“. Wenn du magst, schreib noch eine kurze Nachricht dazu.'
    step_3: 'Die Besitzerin oder der Besitzer bekommt Bescheid und antwortet dir. Die Antwort siehst du auf deiner „Übersicht“, und du bekommst zusätzlich eine E-Mail.'
    step_4: 'Wurde deine Anfrage angenommen? Dann macht ihr aus, wann du das Buch abholst. Es steht jetzt bei dir unter „Geliehen“. Wenn du fertig bist, gibst du es einfach zurück.'
  requests:
    title: 'Jemand möchte dein Buch'
    summary: 'So beantwortest du eine Anfrage.'
    step_1: 'Öffne die „Übersicht“. Neue Anfragen stehen ganz oben unter „Anfragen an dich“. Die Zahl im roten Punkt zeigt, wie viele es sind.'
    step_2: 'Tippe auf „Annehmen“, wenn du das Buch verleihen möchtest. Es gilt dann für 4 Wochen als verliehen. Gib es deinem Freund oder deiner Freundin einfach persönlich.'
    step_3: 'Passt es gerade nicht? Tippe auf „Ablehnen“. Die andere Person bekommt eine freundliche Nachricht.'
  lend:
    title: 'Ein Buch direkt verleihen'
    summary: 'Du hast jemandem ein Buch in die Hand gedrückt? So trägst du es ein.'
    step_1: 'Öffne dein Buch und tippe auf „Verleihen“.'
    step_2: 'Wähle aus, wer das Buch bekommt. Wenn du willst, legst du noch fest, bis wann es zurück sein soll, zum Beispiel „2 Wochen“.'
    step_3: 'Hast du das Buch zurück? Öffne es und tippe auf „Als zurückgegeben markieren“. Oder tippe auf der Übersicht bei „Verliehen“ auf „Ist zurück“.'
    hint: 'Ist das Rückgabedatum vorbei, erinnert FrenchyBook freundlich per E-Mail. Du musst niemandem hinterherlaufen.'
  notifications:
    title: 'Benachrichtigungen einschalten'
    summary: 'Damit dein Handy Bescheid sagt, wenn jemand ein Buch von dir möchte.'
    step_1: 'Tippe unten auf „Profil“.'
    step_2: 'Tippe bei „Benachrichtigungen“ auf „Aktivieren“. Wenn dein Handy fragt, tippe auf „Erlauben“.'
    step_3: 'Fertig! Mit „Test senden“ kannst du ausprobieren, ob es klappt.'
    ios_hint: 'Auf dem iPhone geht das erst, wenn FrenchyBook als App auf dem Home-Bildschirm liegt (siehe „FrenchyBook aufs Handy holen“). Öffne FrenchyBook dann über das Symbol und schalte die Benachrichtigungen dort ein.'
  account:
    title: 'Anmelden, Passwort & Sprache'
    summary: 'Alles rund um dein Konto.'
    login: 'Du meldest dich mit deinem Benutzernamen und deinem Passwort an, nicht mit der E-Mail-Adresse. Lass „Angemeldet bleiben“ angehakt, dann musst du das nur selten tun.'
    forgot: 'Passwort vergessen? Tippe beim Anmelden auf „Passwort vergessen?“. Du bekommst dann eine E-Mail mit einem Link, über den du ein neues Passwort festlegst.'
    language: 'Oben rechts bei der Flagge kannst du zwischen Deutsch und Französisch wechseln.'
    profile: 'Im „Profil“ kannst du deinen Namen, deine E-Mail-Adresse und dein Passwort ändern.'
  problems:
    title: 'Wenn etwas nicht klappt'
    summary: 'Die häufigsten Fragen und was hilft.'
    camera_q: 'Die Kamera geht nicht an.'
    camera_a: 'Dein Handy fragt beim ersten Mal, ob FrenchyBook die Kamera benutzen darf. Dann musst du „Erlauben“ tippen. Hast du aus Versehen „Blockieren“ gedrückt, erlaube die Kamera für frenchybook.com in den Einstellungen deines Browsers. Oder tippe die Nummer vom Strichcode einfach ein.'
    scan_q: 'Der Strichcode wird nicht erkannt.'
    scan_a: 'Sorge für gutes Licht und halte das Handy ruhig, etwa eine Handbreit vom Buch entfernt. Der ganze Strichcode sollte im Rahmen sein. Klappt es trotzdem nicht, tippe die Nummer über dem Strichcode ein.'
    mail_q: 'Ich bekomme keine E-Mail.'
    mail_a: 'Warte ein paar Minuten und schau auch im Spam-Ordner nach. Die E-Mails kommen von noreply@frenchybook.com.'
    login_q: 'Ich komme nicht rein.'
    login_a: 'Benutze deinen Benutzernamen, nicht die E-Mail-Adresse. Achte beim Passwort auf Groß- und Kleinschreibung. Hilft das nicht, tippe auf „Passwort vergessen?“.'
    edit_q: 'Ich habe mich vertippt.'
    edit_a: 'Öffne das Buch und tippe auf „Bearbeiten“. Dort kannst du alles ändern und das Buch auch wieder löschen.'
    lost_q: 'Ein Buch ist nicht zurückgekommen.'
    lost_a: 'Auf der Übersicht unter „Verliehen“ siehst du, wer welches Buch seit wann hat. Ist das Rückgabedatum vorbei, wird das Buch rot markiert, und FrenchyBook erinnert automatisch per E-Mail.'

